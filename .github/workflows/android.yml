name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "librekernel/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "librekernel/**"
      - ".github/workflows/android.yml"
  
permissions:
  contents: read
  actions: read 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :app:assembleRelease

      - uses: r0adkll/sign-android-release@v1
        name: Sign app APK
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: 重命名 APK
        id: rename
        run: |
          VERSION=$(jq -r '.elements[0].versionName // "unknown"' app/build/outputs/apk/release/output-metadata.json)
          NEW_NAME="Cirno-${VERSION}-${{ github.run_number }}.apk"
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "$NEW_NAME"
          echo "new_file=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.new_file }}
          path: ${{ steps.rename.outputs.new_file }}
          if-no-files-found: warn

      - name: Upload CI APK
        if: ${{ github.event_name != 'pull_request' }}
        env:
          CI_UPLOAD_TOKEN: ${{ secrets.CI_UPLOAD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$CI_UPLOAD_TOKEN" ]; then
            echo "CI_UPLOAD_TOKEN not set, skip upload"
            exit 0
          fi

          FILE_NAME="${{ steps.rename.outputs.new_file }}"
          CHANGELOG=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}")

          CHANGELOG=$(echo "$CHANGELOG" | jq -r '.commit.message | split("\n")[0]')

          if [ -z "$CHANGELOG" ] || [ "$CHANGELOG" = "null" ]; then
            CHANGELOG=""
          fi

          CHANGELOG=$(jq -rn --arg v "$CHANGELOG" '$v|@uri')

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer $CI_UPLOAD_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$FILE_NAME" \
            "https://cirno.bot.cd/api/ci?filename=$FILE_NAME&changelog=$CHANGELOG")

          if [[ ! "$HTTP_CODE" =~ ^2[0-9]{2}$ ]]; then
            echo "Failed to upload CI APK: HTTP $HTTP_CODE"
            exit 1
          fi

          echo "CI APK uploaded: $FILE_NAME"

      - name: Publish to Telegram via bot
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CHAT_THREAD: ${{ secrets.TG_CHAT_THREAD }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          BEFORE_SHA=$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")
          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO_SHA" ] && [ "$BEFORE_SHA" != "$CURRENT_SHA" ]; then
            if COMMITS=$(git log --reverse --format='• %h %s' "$BEFORE_SHA..$CURRENT_SHA"); then
              :
            else
              COMMITS=""
            fi
            BASE_LABEL="上次提交"
            BASE_SHA="$BEFORE_SHA"
          else
            if COMMITS=$(git log --reverse --format='• %h %s' "$CURRENT_SHA^..$CURRENT_SHA"); then
              :
            else
              COMMITS=""
            fi
            BASE_LABEL="当前提交"
            BASE_SHA="$CURRENT_SHA"
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS=$(jq -r '.commits[]? | "• \(.id[0:7]) \(.message | split("\n")[0])"' "$GITHUB_EVENT_PATH")
          fi

          if [ -z "$COMMITS" ]; then
            SUBJECT=$(git show -s --format='%s' "$CURRENT_SHA" 2>/dev/null || true)
            COMMITS="• ${CURRENT_SHA:0:7} ${SUBJECT:-提交信息不可用}"
          fi

          HISTORY=$(printf "%s (%s) → 当前 (%s) 的变更：\n%s" "$BASE_LABEL" "${BASE_SHA:0:7}" "${CURRENT_SHA:0:7}" "$COMMITS")

          CAPTION="${HISTORY:0:900}"
          if [ ${#HISTORY} -gt 900 ]; then
            CAPTION="${CAPTION}...（已截断）"
          fi
          
          curl -F document=@"${{ steps.rename.outputs.new_file }}" \
            --form-string caption="$CAPTION" \
            "https://api.telegram.org/bot$TG_BOT_TOKEN/sendDocument?chat_id=$TG_CHAT_ID&message_thread_id=$TG_CHAT_THREAD"
